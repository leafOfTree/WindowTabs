name: release

# Push a tag such as v2025.10.01 to build, test and draft a GitHub release.
# The draft is reviewed and published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag $tag is not vMAJOR.MINOR.PATCH, e.g. v2025.10.01" }
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches[2])".ToLower() >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: dotnet build WindowTabs.sln -c Release -p:Version=${{ steps.version.outputs.number }}

      - name: Run regression tests serially
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Smoke test isolated Release assembly
        shell: powershell
        run: ./tests/Run-ReleaseSmoke.ps1

      - name: Package
        shell: pwsh
        run: |
          # WindowTabs.exe.config carries the WinForms per-monitor DPI settings and must sit next to the exe.
          Compress-Archive -Path WtProgram/bin/Release/WindowTabs.exe, WtProgram/bin/Release/WindowTabs.exe.config `
                           -DestinationPath WindowTabs-${{ github.ref_name }}.zip

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @('--draft', '--generate-notes', '--title', '${{ github.ref_name }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' WindowTabs-${{ github.ref_name }}.zip `
            WtProgram/bin/Release/WindowTabs.exe WtProgram/bin/Release/WindowTabs.exe.config @flags

      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: |
            tests/Debug/*.log
            tests/Debug/*.png
            tests/Debug/test-results.jsonl
          if-no-files-found: ignore
