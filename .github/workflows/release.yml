name: release

# Push a tag such as v2025.10.01 to build, test and draft a GitHub release.
# The draft is reviewed and published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag $tag is not vMAJOR.MINOR.PATCH, e.g. v2025.10.01" }
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build Release
        run: dotnet build WindowTabs.sln -c Release -p:Version=${{ steps.version.outputs.number }}

      # The settings window, crash reports and settings migration all read this version.
      - name: Check the executable carries the tag's version
        shell: pwsh
        env:
          EXPECTED: ${{ steps.version.outputs.number }}
        run: |
          $actual = (Get-Item WtProgram/bin/Release/WindowTabs.exe).VersionInfo.ProductVersion
          if ($actual -ne $env:EXPECTED) { throw "WindowTabs.exe is version $actual, expected $env:EXPECTED" }
          "WindowTabs.exe is version $actual"

      - name: Run regression tests serially
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Smoke test isolated Release assembly
        shell: powershell
        run: ./tests/Run-ReleaseSmoke.ps1

      - name: Upload WindowTabs.exe
        uses: actions/upload-artifact@v6
        with:
          name: release-executable
          path: WtProgram/bin/Release/WindowTabs.exe
          if-no-files-found: error

      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-diagnostics
          path: |
            tests/Debug/*.log
            tests/Debug/test-results.jsonl
          if-no-files-found: ignore

  # Real input against the very file the draft will carry.
  desktop-e2e:
    needs: build
    uses: ./.github/workflows/desktop-e2e-hosted.yml
    with:
      profile: Full
      executable-artifact: release-executable

  draft:
    needs: [build, desktop-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-executable

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $flags = @('--draft', '--generate-notes', '--title', $env:TAG, '--repo', '${{ github.repository }}')
          if ($env:TAG -match '^v\d+\.\d+\.\d+-') { $flags += '--prerelease' }
          gh release create $env:TAG WindowTabs.exe @flags
