name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # NuGet packages are vendored under packages/, so there is nothing to
      # restore. The Release configuration static-links them into a single exe.
      - name: Build Release
        run: msbuild WindowTabs.sln -t:Rebuild -p:Configuration=Release -p:Platform="Mixed Platforms" -m

      - name: Run regression tests serially
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: |
            tests/Debug/*.log
            tests/Debug/*.png
          if-no-files-found: ignore

      - name: Upload WindowTabs.exe
        uses: actions/upload-artifact@v4
        with:
          name: WindowTabs
          path: |
            WtProgram/bin/Release/WindowTabs.exe
            WtProgram/bin/Release/WindowTabs.exe.config
          if-no-files-found: error
