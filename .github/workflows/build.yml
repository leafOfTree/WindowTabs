name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # NuGet packages are vendored under packages/, so there is nothing to
      # restore. The Release configuration static-links them into a single exe.
      - name: Build Release
        run: msbuild WindowTabs.sln -t:Rebuild -p:Configuration=Release -p:Platform="Mixed Platforms" -m

      - name: Upload WindowTabs.exe
        uses: actions/upload-artifact@v4
        with:
          name: WindowTabs
          path: WtProgram/bin/Release/WindowTabs.exe
          if-no-files-found: error
