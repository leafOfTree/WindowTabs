name: Desktop E2E

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test depth: Quick, Full, or 30-minute Soak'
        type: choice
        options: [Quick, Full, Soak]
        default: Quick

permissions:
  contents: read

# All runs share one desktop. Never cancel a running test to start another.
concurrency:
  group: windowtabs-desktop-e2e
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: [self-hosted, Windows, X64, windowtabs-desktop]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run desktop E2E
        id: e2e
        shell: powershell
        env:
          E2E_PROFILE: ${{ inputs.profile }}
        run: ./tests/Run-DesktopE2E.ps1 -Interactive -Profile $env:E2E_PROFILE

      - name: Clean up this test's processes
        if: always() && steps.e2e.outputs.stage != ''
        shell: powershell
        env:
          E2E_STAGE: ${{ steps.e2e.outputs.stage }}
        run: ./tests/Stop-DesktopE2E.ps1 -Stage $env:E2E_STAGE

      - name: Upload desktop diagnostics
        if: always() && steps.e2e.outputs.stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ inputs.profile }}-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ steps.e2e.outputs.stage }}/manifest.json
            ${{ steps.e2e.outputs.stage }}/result.json
            ${{ steps.e2e.outputs.stage }}/stdout.log
            ${{ steps.e2e.outputs.stage }}/stderr.log
            ${{ steps.e2e.outputs.stage }}/failure.txt
            ${{ steps.e2e.outputs.stage }}/windows.json
            ${{ steps.e2e.outputs.stage }}/WindowTabsCrash.log
          if-no-files-found: warn
